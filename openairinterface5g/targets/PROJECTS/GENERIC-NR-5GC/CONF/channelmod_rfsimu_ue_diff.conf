#/* Per-UE asymmetric channel configuration for dApp evaluation */
#/* Based on OAI official channel_simulation.md example */
#/* ploss_dB=20 for both UEs (signal attenuation) → noise_power_dB creates effective SNR gap */
#/* UE0 (rfsimu_channel_ue0): good channel  – noise=-4dB  → high SNR, forgetfact=0.99 (거의 고정 채널) */
#/* UE1 (rfsimu_channel_ue1): poor channel  – noise=-2dB  → low SNR  (~10dB gap expected) */
#/*   forgetfact=0.5 → 매 호출마다 채널을 더 크게 갱신해 시간에 따른 변동을 유도 */
#/*   (참고: speed_min/speed_max, maxDoppler 등은 이 OAI 버전의 config 파서에 없는 키라 사용 불가.
#/*    forgetfact가 random_channel.c에서 실제로 지원하는 유일한 시간변화 파라미터.) */
channelmod = {
  max_chan = 10;
  modellist = "modellist_rfsimu_1";
  modellist_rfsimu_1 = (
    {
      model_name     = "rfsimu_channel_ue0";
      type           = "TDL_C";
      ploss_dB       = 20;
      noise_power_dB = -4;
      forgetfact     = 0.99;
      offset         = 0;
      ds_tdl         = 10e-9;
    },
    {
      model_name     = "rfsimu_channel_ue1";
      type           = "TDL_C";
      ploss_dB       = 20;
      noise_power_dB = -2;
      forgetfact     = 0.5;
      offset         = 0;
      ds_tdl         = 10e-9;
    }
  );
};
